<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Boolean Logic Test Page</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            body, select, td, input {
                font-family: Arial, Helvetica, sans-serif;
                font-size: 18px;
            }
            a {
                color: navy;
            }
            a:hover {
                color: red;
                text-decoration: none;
            }
            table {
                margin: auto;
                margin-top: 100px;
                border-collapse: collapse;
                background-color: whitesmoke;
                border-radius: 5px;
                padding: 5px;
            }
            td {
                text-align: center;
                width: 80px;
                margin: 2px;
                padding: 5px;
            }
            select, input {
                width: 75px;
                text-align: center;
            }
            .active {
                background-color: lightseagreen;
                color: whitesmoke;
            }
            .result {
                background-color: white;
                font-family: 'Courier New', Courier, monospace;
                color: navy;
                font-weight: bold;
                white-space: nowrap;
            }
            .small {
                font-size: 8px;
            }
        </style>
        <script>
            // Every possible pair of (left, right) values, in truth-table order
            const poss = [
                [true, true],
                [true, false],
                [false, true],
                [false, false]
            ];

            // Find the row index whose values match the given pair
            function getIndexOf(arr, sub_arr) {
                for (let i = 0; i < arr.length; i++) {
                    if (arr[i][0] === sub_arr[0] && arr[i][1] === sub_arr[1]) {
                        return i;
                    }
                }
                return undefined;
            }

            function updateTable() {
                try {
                    const left = document.getElementById("left").value === "true";
                    const right = document.getElementById("right").value === "true";
                    const op = document.getElementById("operator").value;

                    document.getElementById("op_name").textContent = op;
                    document.querySelectorAll(".left").forEach(cell => cell.style.display = "");

                    const cond = [left, right];
                    // NOT only uses the right operand, so its row is chosen from that alone
                    const index = op === "not" ? (right ? 0 : 1) : getIndexOf(poss, cond);
                    const max = op === "not" ? poss.length / 2 : poss.length;
                    let result = false;

                    const body = document.getElementById("truth_table_body");
                    body.innerHTML = "";

                    for (let i = 0; i < max; i++) {
                        const l = poss[i][0];
                        const r = poss[i][1];
                        const and = l && r;
                        const or = l || r;
                        const not = !r;
                        const xor = or && !and;
                        let res = false;
                        switch (op) {
                            case "and":
                                res = and;
                                break;
                            case "or":
                                res = or;
                                break;
                            case "not":
                                res = not;
                                break;
                            case "xor":
                                res = xor;
                                break;
                        }
                        if (i === index) result = res;

                        const activeClass = i === index ? " class='active'" : "";
                        let row = `<tr${activeClass}>`;
                        row += `<td class='left'>${poss[i][0].toString().substring(0, 1)}</td>`;
                        row += `<td>${res.toString().substring(0, 1).toUpperCase()}</td>`;
                        row += `<td>${poss[i][1].toString().substring(0, 1)}</td></tr>`;
                        body.insertAdjacentHTML("beforeend", row);
                    }

                    let end = "<tr><td colspan='3' class='small result'>&nbsp;</td></tr>";
                    const expression = op === "not"
                        ? `${op.toUpperCase()} ${right} = ${result}`
                        : `${left} ${op.toUpperCase()} ${right} = ${result}`;
                    end += `<tr><td colspan='3' class='result'>${expression}</td></tr>`;
                    body.insertAdjacentHTML("beforeend", end);

                    if (op === "not") {
                        document.querySelectorAll(".left").forEach(cell => cell.style.display = "none");
                    }
                } catch (e) {
                    console.log(`ERROR: ${e}`);
                }
            }

            document.addEventListener("DOMContentLoaded", function () {
                document.querySelectorAll("select").forEach(select => {
                    select.addEventListener("change", updateTable);
                });
                updateTable();
            });
        </script>
    </head>
    <body>
        <table id="truth_table">
            <thead>
                <tr>
                    <td class="left">
                        <select aria-label="Left operand" name="left" id="left" class="operand">
                            <option value="true">true</option>
                            <option value="false">false</option>
                        </select>
                    </td>
                    <td>
                        <select aria-label="Operator" name="operator" id="operator">
                            <option value="and">AND</option>
                            <option value="or">OR</option>
                            <option value="not">NOT</option>
                            <option value="xor">XOR</option>
                        </select>
                    </td>
                    <td>
                        <select aria-label="Right operand" name="right" id="right" class="operand">
                            <option value="true">true</option>
                            <option value="false">false</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td colspan="3" class="small">&nbsp;</td>
                </tr>
                <tr>
                    <td class="left">p</td>
                    <td id="op_name">op</td>
                    <td>q</td>
                </tr>
                <tr>
                    <td colspan="3"><hr></td>
                </tr>
            </thead>
            <tbody id="truth_table_body">
                <tr>
                    <td class="left">1</td>
                    <td>2</td>
                    <td>3</td>
                </tr>
            </tbody>
        </table>
    </body>
</html>

{% extends "learning_logs/base.html" %}
{% load django_bootstrap5 %}

{% block content %}
  <h2 class="mb-3">Add a new topic</h2>

  <form method="post" action="{% url 'learning_logs:new_topic' %}">
    {% csrf_token %}
    {% bootstrap_form form %}
    {% bootstrap_button button_type="submit" content="Add topic" %}
  </form>
{% endblock content %}

{% extends "learning_logs/base.html" %}

{% block content %}
  <h2 class="mb-3">Topics</h2>

  <a class="btn btn-primary mb-3" href="{% url 'learning_logs:new_topic' %}">Add a new topic</a>

  <div class="list-group">
    {% for topic in topics %}
      <a class="list-group-item list-group-item-action" href="{% url 'learning_logs:topic' topic.id %}">{{ topic.text }}</a>
    {% empty %}
      <div class="list-group-item">No topics have been added yet.</div>
    {% endfor %}
  </div>
{% endblock content %}

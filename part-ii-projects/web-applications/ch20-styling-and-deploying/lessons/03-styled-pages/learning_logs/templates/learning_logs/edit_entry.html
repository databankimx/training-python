{% extends "learning_logs/base.html" %}
{% load django_bootstrap5 %}

{% block content %}
  <p><a href="{% url 'learning_logs:topic' topic.id %}">{{ topic.text }}</a></p>

  <h2 class="mb-3">Edit entry</h2>

  <form method="post" action="{% url 'learning_logs:edit_entry' entry.id %}">
    {% csrf_token %}
    {% bootstrap_form form %}
    {% bootstrap_button button_type="submit" content="Save changes" %}
  </form>

  <p class="mt-3"><a href="{% url 'learning_logs:delete_entry' entry.id %}">Delete this entry</a></p>
{% endblock content %}

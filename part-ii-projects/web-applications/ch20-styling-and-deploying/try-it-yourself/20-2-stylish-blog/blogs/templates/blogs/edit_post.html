{% extends "blogs/base.html" %}
{% load django_bootstrap5 %}

{% block content %}
  <h2 class="mb-3">Edit the post in {{ post.blog.title }}</h2>

  <form method="post" action="{% url 'blogs:edit_post' post.id %}">
    {% csrf_token %}
    {% bootstrap_form form %}
    {% bootstrap_button button_type="submit" content="Save changes" %}
  </form>
{% endblock content %}

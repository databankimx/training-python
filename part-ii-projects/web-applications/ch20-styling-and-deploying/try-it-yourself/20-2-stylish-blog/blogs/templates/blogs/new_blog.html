{% extends "blogs/base.html" %}
{% load django_bootstrap5 %}

{% block content %}
  <h2 class="mb-3">Make a new blog</h2>

  <form method="post" action="{% url 'blogs:new_blog' %}">
    {% csrf_token %}
    {% bootstrap_form form %}
    {% bootstrap_button button_type="submit" content="Make blog" %}
  </form>
{% endblock content %}

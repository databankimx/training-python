{% extends "blogs/base.html" %}
{% load django_bootstrap5 %}

{% block content %}
  <h2 class="mb-3">Write a post in {{ blog.title }}</h2>

  <form method="post" action="{% url 'blogs:new_post' blog.id %}">
    {% csrf_token %}
    {% bootstrap_form form %}
    {% bootstrap_button button_type="submit" content="Add post" %}
  </form>
{% endblock content %}

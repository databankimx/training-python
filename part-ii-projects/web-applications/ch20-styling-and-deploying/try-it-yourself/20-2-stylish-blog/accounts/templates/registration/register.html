{% extends "blogs/base.html" %}
{% load django_bootstrap5 %}

{% block content %}
  <h2 class="mb-3">Register</h2>

  <form method="post" action="{% url 'accounts:register' %}">
    {% csrf_token %}
    {% bootstrap_form form %}
    {% bootstrap_button button_type="submit" content="Register" %}
  </form>
{% endblock content %}

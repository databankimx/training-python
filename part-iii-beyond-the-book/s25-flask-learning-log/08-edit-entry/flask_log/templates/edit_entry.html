{% extends "base.html" %}

{% block title %}Edit entry - Learning Log{% endblock %}

{% block content %}
  <p><a href="{{ url_for('topic', topic_id=entry.topic_id) }}">{{ entry.topic.text }}</a></p>

  <h2 class="mb-3">Edit entry</h2>

  {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
  {% endif %}

  <form method="post" action="{{ url_for('edit_entry', entry_id=entry.id) }}">
    <div class="mb-3">
      <label for="text" class="form-label">Entry</label>
      <textarea class="form-control" id="text" name="text" rows="6">{{ text }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary">Save changes</button>
  </form>
{% endblock %}

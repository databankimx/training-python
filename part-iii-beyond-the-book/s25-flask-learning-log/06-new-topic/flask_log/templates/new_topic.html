{% extends "base.html" %}

{% block title %}New topic - Learning Log{% endblock %}

{% block content %}
  <h2 class="mb-3">Add a new topic</h2>

  {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
  {% endif %}

  <form method="post" action="{{ url_for('new_topic') }}">
    <div class="mb-3">
      <label for="text" class="form-label">Topic name</label>
      <input type="text" class="form-control" id="text" name="text" maxlength="200" value="{{ text }}">
    </div>
    <button type="submit" class="btn btn-primary">Add topic</button>
  </form>
{% endblock %}

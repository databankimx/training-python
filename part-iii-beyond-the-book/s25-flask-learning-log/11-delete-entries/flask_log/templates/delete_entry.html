{% extends "base.html" %}

{% block title %}Delete entry - Learning Log{% endblock %}

{% block content %}
  <p><a href="{{ url_for('topic', topic_id=entry.topic_id) }}">{{ entry.topic.text }}</a></p>

  <h2 class="mb-3">Delete this entry?</h2>

  <blockquote class="blockquote">
    <p>{{ entry.text }}</p>
  </blockquote>

  <form method="post" action="{{ url_for('delete_entry', entry_id=entry.id) }}" class="d-inline">
    <button type="submit" class="btn btn-danger">Delete entry</button>
  </form>
  <a class="btn btn-secondary ms-2" href="{{ url_for('topic', topic_id=entry.topic_id) }}">Cancel</a>
{% endblock %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Learning Log{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <nav class="navbar navbar-expand-md navbar-dark bg-dark mb-4 border-bottom">
    <div class="container-fluid">
      <a class="navbar-brand" href="{{ url_for('index') }}">Learning Log</a>
      <div class="navbar-nav me-auto">
        <a class="nav-link" href="{{ url_for('index') }}">Home</a>
        <a class="nav-link" href="{{ url_for('topics') }}">Topics</a>
      </div>
      <div class="navbar-nav">
        {% if current_username %}
          <span class="navbar-text me-2">Hello, {{ current_username }}.</span>
          <form method="post" action="{{ url_for('accounts.logout') }}" class="d-inline">
            <button type="submit" class="btn btn-outline-light btn-sm">Log out</button>
          </form>
        {% else %}
          <a class="nav-link" href="{{ url_for('accounts.login') }}">Log in</a>
          <a class="nav-link" href="{{ url_for('accounts.register') }}">Register</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
